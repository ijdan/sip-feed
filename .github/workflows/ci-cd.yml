name: CI/CD — Sip-feed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT: tech-news-aggregator-001
  GCP_REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/tech-news-aggregator-001/tech-news-repo
  BACKEND_URL: https://backend-159654598910.europe-west1.run.app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Détection des changements ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:   ${{ steps.filter.outputs.backend }}
      frontend:  ${{ steps.filter.outputs.frontend }}
      collector: ${{ steps.filter.outputs.collector }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            collector:
              - 'collector/**'

  # ─── Tests frontend (TypeScript) ──────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: TypeScript check
        run: cd frontend && node_modules/.bin/tsc --noEmit

  # ─── Tests collector (syntax + tests fonctionnels) ────────────────────────
  test-collector:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.collector == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd collector
          pip install -r requirements.txt --quiet
          pip install pytest httpx pyjwt python-dotenv --quiet
      - name: Syntax check
        run: |
          cd collector
          python -m py_compile main.py
          python -m py_compile scrapers/web_scraper.py
          python -m py_compile scrapers/gmail_reader.py
          python -m py_compile processors/gemini_processor.py
      - name: Tests fonctionnels — Scraper & Collector
        env:
          GEMINI_API_KEY: "AIza_CI_TEST_DUMMY_KEY"
          GRPC_DNS_RESOLVER: native
        run: |
          cd tests
          python -m pytest test_scraper.py test_collector.py \
            -v --tb=short --no-header \
            -k "not test_web_scraper"
      - name: Test scraper web (avec internet)
        continue-on-error: true
        run: |
          cd tests
          python -m pytest test_scraper.py::test_web_scraper_returns_articles \
            test_scraper.py::test_web_scraper_article_structure \
            -v --tb=short --no-header

  # ─── Deploy backend ────────────────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build & push image
        run: |
          docker build -t ${{ env.REGISTRY }}/backend:latest ./backend
          docker push ${{ env.REGISTRY }}/backend:latest
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --image=${{ env.REGISTRY }}/backend:latest \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="FIRESTORE_PROJECT_ID=${{ env.GCP_PROJECT }},GRPC_DNS_RESOLVER=native,JWT_ALGORITHM=HS256,JWT_EXPIRE_MINUTES=1440" \
            --set-secrets="GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,JWT_SECRET=JWT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --project=${{ env.GCP_PROJECT }} \
            --quiet

  # ─── Deploy frontend ───────────────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [changes, test-frontend]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build & push image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.BACKEND_URL }} \
            -t ${{ env.REGISTRY }}/frontend:latest \
            ./frontend
          docker push ${{ env.REGISTRY }}/frontend:latest
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy frontend \
            --image=${{ env.REGISTRY }}/frontend:latest \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="NEXTAUTH_URL=https://frontend-o3hq6ak3ka-ew.a.run.app" \
            --set-secrets="GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest" \
            --project=${{ env.GCP_PROJECT }} \
            --quiet

  # ─── Deploy collector ──────────────────────────────────────────────────────
  deploy-collector:
    runs-on: ubuntu-latest
    needs: [changes, test-collector]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.collector == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build & push image
        run: |
          docker build -t ${{ env.REGISTRY }}/collector:latest ./collector
          docker push ${{ env.REGISTRY }}/collector:latest
      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update collector \
            --image=${{ env.REGISTRY }}/collector:latest \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --quiet

  # ─── Santé post-déploiement ────────────────────────────────────────────────
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-collector]
    if: github.ref == 'refs/heads/main' && always()
    steps:
      - name: Backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.BACKEND_URL }}/health)
          [ "$STATUS" = "200" ] && echo "✅ Backend OK" || echo "❌ Backend KO ($STATUS)"
      - name: Frontend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://frontend-o3hq6ak3ka-ew.a.run.app)
          [ "$STATUS" = "200" ] && echo "✅ Frontend OK" || echo "❌ Frontend KO ($STATUS)"
