name: E2E — Playwright

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/**'
      - 'tests/seed_articles_for_e2e.py'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/**'
      - 'tests/seed_articles_for_e2e.py'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Backend
      FIRESTORE_EMULATOR_HOST: localhost:8080
      GRPC_DNS_RESOLVER: native
      APP_ENV: local
      FIRESTORE_PROJECT_ID: tech-news-aggregator-001
      GOOGLE_CLOUD_PROJECT: tech-news-aggregator-001
      GOOGLE_CLIENT_ID: dummy-google-client-id
      GOOGLE_CLIENT_SECRET: dummy-google-client-secret
      JWT_SECRET: dummy-jwt-secret-for-ci-only
      GEMINI_API_KEY: dummy-gemini-key
      # Frontend (NEXT_PUBLIC_* injected at build/run time)
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
      GITHUB_CLIENT_ID: dummy-github-client-id
      GITHUB_CLIENT_SECRET: dummy-github-client-secret

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Java 21 (requis par firebase-tools récent)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Installer dépendances frontend
        run: cd frontend && npm ci

      - name: Installer dépendances backend
        run: pip install --quiet -r backend/requirements.txt

      - name: Installer Chromium pour Playwright
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Démarrer services et lancer les tests E2E
        run: |
          set -e

          echo "::group::Émulateur Firestore"
          firebase emulators:start --only firestore --project tech-news-aggregator-001 > /tmp/emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080 >/dev/null 2>&1; then
              echo "Émulateur prêt après ${i}s"
              break
            fi
            sleep 1
          done
          curl -s http://localhost:8080 >/dev/null || { echo "ÉMULATEUR KO"; tail -50 /tmp/emulator.log; exit 1; }
          echo "::endgroup::"

          echo "::group::Seed 30 articles factices"
          python tests/seed_articles_for_e2e.py
          echo "::endgroup::"

          echo "::group::Backend FastAPI"
          ( cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 & )
          for i in $(seq 1 60); do
            if curl -s http://localhost:8000/health >/dev/null 2>&1; then
              echo "Backend prêt après ${i}s"
              break
            fi
            sleep 1
          done
          curl -sS http://localhost:8000/health || { echo "BACKEND KO"; tail -50 /tmp/backend.log; exit 1; }
          echo "::endgroup::"

          echo "::group::Frontend Next.js (dev)"
          ( cd frontend && npm run dev > /tmp/frontend.log 2>&1 & )
          for i in $(seq 1 180); do
            if curl -s http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend prêt après ${i}s"
              break
            fi
            sleep 1
          done
          curl -sS -o /dev/null -w "Frontend HTTP %{http_code}\n" http://localhost:3000 \
            || { echo "FRONTEND KO"; tail -50 /tmp/frontend.log; exit 1; }
          echo "::endgroup::"

          echo "::group::Playwright"
          cd frontend && npm run e2e
          echo "::endgroup::"

      - name: Upload du rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Logs backend (en cas d'échec)
        if: failure()
        run: |
          echo "=== Backend log (last 100 lines) ==="
          tail -100 /tmp/backend.log || true
          echo "=== Frontend log (last 100 lines) ==="
          tail -100 /tmp/frontend.log || true
