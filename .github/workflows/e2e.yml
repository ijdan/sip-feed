name: E2E — Playwright

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/**'
      - 'tests/seed_articles_for_e2e.py'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/**'
      - 'tests/seed_articles_for_e2e.py'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Backend
      FIRESTORE_EMULATOR_HOST: localhost:8080
      GRPC_DNS_RESOLVER: native
      APP_ENV: local
      FIRESTORE_PROJECT_ID: tech-news-aggregator-001
      GOOGLE_CLOUD_PROJECT: tech-news-aggregator-001
      GOOGLE_CLIENT_ID: dummy-google-client-id
      GOOGLE_CLIENT_SECRET: dummy-google-client-secret
      JWT_SECRET: dummy-jwt-secret-for-ci-only
      GEMINI_API_KEY: dummy-gemini-key
      # Frontend (NEXT_PUBLIC_* injected at build/run time)
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
      GITHUB_CLIENT_ID: dummy-github-client-id
      GITHUB_CLIENT_SECRET: dummy-github-client-secret

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Java 17 (requis par Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Installer dépendances frontend
        run: cd frontend && npm ci

      - name: Installer dépendances backend
        run: pip install --quiet -r backend/requirements.txt

      - name: Installer Chromium pour Playwright
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Démarrer l'émulateur Firestore
        run: |
          firebase emulators:start --only firestore --project tech-news-aggregator-001 &
          # Attendre que le port 8080 réponde
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080 >/dev/null 2>&1; then
              echo "Émulateur Firestore prêt"
              break
            fi
            sleep 1
          done

      - name: Seeder 30 articles factices
        run: python tests/seed_articles_for_e2e.py

      - name: Démarrer le backend FastAPI
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://localhost:8000/health >/dev/null 2>&1; then
              echo "Backend prêt"
              break
            fi
            sleep 1
          done
          curl -s http://localhost:8000/health || (echo "Backend KO"; cat /tmp/backend.log; exit 1)

      - name: Démarrer le frontend Next.js (dev)
        working-directory: frontend
        run: |
          npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -s http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend prêt"
              break
            fi
            sleep 1
          done
          curl -sS http://localhost:3000 -o /dev/null -w "frontend HTTP %{http_code}\n" \
            || (echo "Frontend KO"; tail -40 /tmp/frontend.log; exit 1)

      - name: Lancer les tests E2E Playwright
        working-directory: frontend
        run: npm run e2e

      - name: Upload du rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Logs backend (en cas d'échec)
        if: failure()
        run: |
          echo "=== Backend log (last 100 lines) ==="
          tail -100 /tmp/backend.log || true
          echo "=== Frontend log (last 100 lines) ==="
          tail -100 /tmp/frontend.log || true
