name: 2. Implémentation de la feature

# Déclenché :
#  - automatiquement après succès du workflow 1 (workflow_run)
#  - manuellement sur push feature/** si tests/acceptance/** change SANS [skip ci]
#    (cas où le développeur écrit lui-même ses step definitions et veut juste
#    déclencher l'implémentation)

on:
  workflow_run:
    workflows: ["1. Génération des tests d'acceptance"]
    types: [completed]
    branches: ['feature/**']
  push:
    branches:
      - 'feature/**'
    paths:
      - 'tests/acceptance/**'

jobs:
  implement:
    # Sur workflow_run : uniquement si le wf1 a réussi.
    # Sur push : filtrer par auteur claude-bot (commits du bot ne re-déclenchent
    # pas le wf2, sinon boucle). On évite [skip ci] dans le message car le
    # squash merge en hériterait et bloquerait ci-cd.yml ensuite.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && github.event.head_commit.author.email != 'claude-bot@users.noreply.github.com')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Déterminer la branche cible
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            BRANCH="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Branche cible : $BRANCH"

      - name: Checkout (avec la bonne branche)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer toutes les dépendances
        run: |
          pip install --quiet -r scripts/requirements.txt
          pip install --quiet -r tests/requirements.txt
          pip install --quiet -r backend/requirements.txt

      - name: Détecter les features à implémenter
        id: features
        run: |
          # Une feature est à implémenter si : test_<slug>.py existe ET pytest échoue dessus.
          # (idempotent : si les tests passent déjà, on skippe)
          TO_IMPLEMENT=()
          for f in features/*.feature; do
            [ -e "$f" ] || continue
            slug=$(basename "$f" .feature | tr '[:upper:]-' '[:lower:]_' | tr -cd 'a-z0-9_')
            test_file="tests/acceptance/test_${slug}.py"
            if [ ! -f "$test_file" ]; then
              continue
            fi
            python -m pytest "$test_file" --tb=no -q 2>/dev/null
            if [ $? -ne 0 ]; then
              TO_IMPLEMENT+=("$f")
              echo "  → à implémenter : $f"
            else
              echo "  → déjà vert, ignoré : $f"
            fi
          done
          if [ ${#TO_IMPLEMENT[@]} -eq 0 ]; then
            echo "Aucune feature à implémenter."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "feature=${TO_IMPLEMENT[0]}" >> "$GITHUB_OUTPUT"
            slug=$(basename "${TO_IMPLEMENT[0]}" .feature | tr '[:upper:]-' '[:lower:]_' | tr -cd 'a-z0-9_')
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
          fi

      - name: Implémenter la feature via Claude (Opus 4.7, max 15 turns)
        id: implement
        if: steps.features.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_TURNS: '15'
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set +e
          python scripts/implement_feature.py "${{ steps.features.outputs.feature }}"
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0  # on continue même si tests rouges, pour ouvrir la PR avec label

      - name: Commit et push le code généré
        if: steps.features.outputs.found == 'true'
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

          git add backend/ collector/ frontend/src/ tests/ infrastructure/ features/

          if git diff --cached --quiet; then
            echo "Aucun changement à commiter (le bot n'a rien produit)"
            exit 0
          fi

          STATUS_LABEL=$([ "${{ steps.implement.outputs.exit_code }}" = "0" ] \
            && echo "tests verts" || echo "tests rouges, review humaine requise")

          # Pas de [skip ci] dans le message : on filtre par auteur (claude-bot)
          # au niveau du job pour éviter les boucles. Mettre [skip ci] dans le
          # message provoquerait le skip de ci-cd.yml lors du squash merge.
          git commit -m "implémentation de ${{ steps.features.outputs.slug }} (${STATUS_LABEL})"
          git push origin "HEAD:${{ steps.branch.outputs.branch }}"

      - name: Merger ou ouvrir PR selon résultat des tests
        if: steps.features.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          SLUG="${{ steps.features.outputs.slug }}"
          EXIT="${{ steps.implement.outputs.exit_code }}"

          # PR existe déjà ?
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number' || echo "")

          if [ "$EXIT" = "0" ]; then
            # Tests verts → merge automatique vers main (déploiement direct)
            BODY="Feature implémentée et déployée automatiquement par Claude (Opus 4.7).

          ## Statut
          🟢 **Tests d'acceptance verts** — mergé automatiquement.

          ## Fichiers modifiés
          Voir le diff pour la liste complète des fichiers impactés.

          🤖 Generated by implement-feature.yml"

            if [ -n "$EXISTING" ]; then
              gh pr merge "$EXISTING" --squash --delete-branch --auto
            else
              PR_URL=$(gh pr create --base main --head "$BRANCH" --title "feat: $SLUG" --body "$BODY")
              gh pr merge "$PR_URL" --squash --delete-branch
            fi
          else
            # Tests rouges → PR draft pour review humaine
            BODY="Feature implémentée partiellement par Claude (Opus 4.7).

          ## Statut
          🔴 **Tests d'acceptance toujours rouges** après 15 turns. Intervention humaine requise.

          ## Fichiers modifiés (état partiel)
          Voir le diff pour les changements partiels produits par l'agent.

          ## Logs
          Voir l'onglet Actions du run pour les logs détaillés.

          🤖 Generated by implement-feature.yml"
            gh label create "needs-human-review" --color "FBCA04" --description "PR nécessitant une revue humaine" --force 2>/dev/null || true
            if [ -n "$EXISTING" ]; then
              gh pr edit "$EXISTING" --add-label "needs-human-review" || true
              gh pr comment "$EXISTING" --body "🔴 Nouveau push : tests rouges après max-turns. Review humaine requise."
            else
              gh pr create --draft --base main --head "$BRANCH" --title "feat(WIP): $SLUG" --body "$BODY" --label "needs-human-review"
            fi
          fi
